[project]
name = "churn-api"
version = "0.1.0"
description = "FastAPI adapter package for churn analytics artifacts."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.125.0",
  "httpx>=0.28.1",
  # Runtime composition: the filesystem reader validates artifacts produced
  # by churn-ml. Package-local locks stay out; the workspace tracks uv.lock.
  "churn-ml @ ../packages/ml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/churn_api"]
